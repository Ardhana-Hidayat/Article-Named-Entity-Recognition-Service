<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Article Named Entity Recognition (NER) Service - Extract named entities from news articles using AI-powered NLP pipeline">
    <title>Article NER Service — Named Entity Recognition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: rgba(17, 24, 39, 0.8);
            --bg-input: rgba(30, 41, 59, 0.6);
            --border: rgba(99, 102, 241, 0.2);
            --border-focus: rgba(99, 102, 241, 0.5);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #6366f1;
            --accent-light: #818cf8;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
            --person: #f472b6;
            --org: #60a5fa;
            --gpe: #34d399;
            --date: #fbbf24;
            --event: #a78bfa;
            --shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            --radius: 12px;
            --radius-sm: 8px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Animated gradient background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 50%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(139, 92, 246, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .header__badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: var(--accent-glow);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--accent-light);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 1rem;
        }

        .header__badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: var(--accent);
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.8); }
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f1f5f9, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Card */
        .card {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.75rem;
            box-shadow: var(--shadow);
            margin-bottom: 1.5rem;
            transition: border-color 0.3s ease;
        }

        .card:hover {
            border-color: rgba(99, 102, 241, 0.3);
        }

        .card__title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card__title svg {
            width: 16px;
            height: 16px;
            opacity: 0.7;
        }

        /* Form */
        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            outline: none;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        input[type="text"]::placeholder, textarea::placeholder {
            color: var(--text-muted);
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        .char-count {
            text-align: right;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .char-count.warning {
            color: var(--warning);
        }

        .char-count.error {
            color: var(--error);
        }

        /* Button */
        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: linear-gradient(135deg, var(--accent), #4f46e5);
            border: none;
            border-radius: var(--radius-sm);
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-submit.loading {
            color: transparent;
        }

        .btn-submit.loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 20px;
            height: 20px;
            margin: -10px 0 0 -10px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Validation */
        .validation-msg {
            font-size: 0.78rem;
            color: var(--error);
            margin-top: 4px;
            display: none;
            align-items: center;
            gap: 4px;
        }

        .validation-msg.show {
            display: flex;
        }

        /* Results */
        .results {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .results__summary {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }

        .stat-chip {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .stat-chip strong {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Entity table */
        .entity-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .entity-table thead th {
            text-align: left;
            padding: 0.6rem 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }

        .entity-table tbody tr {
            border-bottom: 1px solid rgba(99, 102, 241, 0.08);
            transition: background 0.15s ease;
        }

        .entity-table tbody tr:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        .entity-table td {
            padding: 0.6rem 0.75rem;
            vertical-align: middle;
        }

        .entity-text {
            font-weight: 500;
            color: var(--text-primary);
        }

        .label-badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.72rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .label-badge.PERSON { background: rgba(244, 114, 182, 0.15); color: var(--person); border: 1px solid rgba(244, 114, 182, 0.3); }
        .label-badge.ORG { background: rgba(96, 165, 250, 0.15); color: var(--org); border: 1px solid rgba(96, 165, 250, 0.3); }
        .label-badge.GPE { background: rgba(52, 211, 153, 0.15); color: var(--gpe); border: 1px solid rgba(52, 211, 153, 0.3); }
        .label-badge.DATE { background: rgba(251, 191, 36, 0.15); color: var(--date); border: 1px solid rgba(251, 191, 36, 0.3); }
        .label-badge.EVENT { background: rgba(167, 139, 250, 0.15); color: var(--event); border: 1px solid rgba(167, 139, 250, 0.3); }

        .offset-text {
            font-family: 'Courier New', monospace;
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        /* Highlighted text view */
        .highlighted-text {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 1rem;
            margin-top: 1rem;
            line-height: 1.8;
            font-size: 0.88rem;
            white-space: pre-wrap;
            word-wrap: break-word;
            max-height: 300px;
            overflow-y: auto;
        }

        .hl-PERSON { background: rgba(244, 114, 182, 0.2); border-bottom: 2px solid var(--person); padding: 1px 2px; border-radius: 2px; }
        .hl-ORG { background: rgba(96, 165, 250, 0.2); border-bottom: 2px solid var(--org); padding: 1px 2px; border-radius: 2px; }
        .hl-GPE { background: rgba(52, 211, 153, 0.2); border-bottom: 2px solid var(--gpe); padding: 1px 2px; border-radius: 2px; }
        .hl-DATE { background: rgba(251, 191, 36, 0.2); border-bottom: 2px solid var(--date); padding: 1px 2px; border-radius: 2px; }
        .hl-EVENT { background: rgba(167, 139, 250, 0.2); border-bottom: 2px solid var(--event); padding: 1px 2px; border-radius: 2px; }

        /* Error display */
        .error-box {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: var(--radius-sm);
            padding: 1rem;
            color: #fca5a5;
            font-size: 0.85rem;
            display: none;
        }

        .error-box.show {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* No entities message */
        .no-entities {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .no-entities svg {
            width: 40px;
            height: 40px;
            margin-bottom: 0.75rem;
            opacity: 0.4;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem 0;
            color: var(--text-muted);
            font-size: 0.75rem;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .container { padding: 1rem; }
            .header h1 { font-size: 1.5rem; }
            .card { padding: 1.25rem; }
            .entity-table { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header__badge">
                <span>AI-Powered NLP</span>
            </div>
            <h1>Article NER Service</h1>
            <p>Extract named entities from news articles using machine learning</p>
        </header>

        <!-- Input Form -->
        <div class="card" id="input-card">
            <div class="card__title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Article Input
            </div>

            <form id="ner-form">
                <div class="form-group">
                    <label for="title-input">Article Title</label>
                    <input type="text" id="title-input" placeholder="Enter the article title..." maxlength="500" required>
                    <div class="validation-msg" id="title-error">Title is required</div>
                </div>

                <div class="form-group">
                    <label for="body-input">Article Body</label>
                    <textarea id="body-input" placeholder="Paste the article body text here..." required></textarea>
                    <div class="char-count" id="char-count">0 / 50,000 characters</div>
                    <div class="validation-msg" id="body-error">Body is required</div>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">
                    Extract Entities
                </button>
            </form>
        </div>

        <!-- Error Display -->
        <div class="error-box" id="error-box"></div>

        <!-- Results -->
        <div id="results-container" style="display: none;">
            <div class="card results">
                <div class="card__title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                    Extraction Results
                </div>

                <div class="results__summary" id="results-summary"></div>

                <div id="entity-table-wrapper"></div>

                <!-- Highlighted Text View -->
                <div class="card__title" style="margin-top: 1.25rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                    Highlighted Text
                </div>
                <div class="highlighted-text" id="highlighted-text"></div>
            </div>
        </div>

        <footer class="footer">
            Article NER Service &mdash; Powered by spaCy Fine-tuned Model
        </footer>
    </div>

    <script>
        const form = document.getElementById('ner-form');
        const titleInput = document.getElementById('title-input');
        const bodyInput = document.getElementById('body-input');
        const submitBtn = document.getElementById('submit-btn');
        const charCount = document.getElementById('char-count');
        const errorBox = document.getElementById('error-box');
        const resultsContainer = document.getElementById('results-container');
        const MAX_CHARS = 50000;

        // Character count for body
        bodyInput.addEventListener('input', () => {
            const combined = (titleInput.value.trim() + '\n\n' + bodyInput.value.trim()).length;
            charCount.textContent = `${combined.toLocaleString()} / ${MAX_CHARS.toLocaleString()} characters`;
            charCount.className = 'char-count';
            if (combined > MAX_CHARS * 0.9) charCount.className = 'char-count warning';
            if (combined > MAX_CHARS) charCount.className = 'char-count error';
        });

        titleInput.addEventListener('input', () => bodyInput.dispatchEvent(new Event('input')));

        // Client-side validation
        function validate() {
            let valid = true;
            const titleErr = document.getElementById('title-error');
            const bodyErr = document.getElementById('body-error');

            if (!titleInput.value.trim()) {
                titleErr.classList.add('show');
                titleErr.textContent = 'Title is required';
                valid = false;
            } else {
                titleErr.classList.remove('show');
            }

            if (!bodyInput.value.trim()) {
                bodyErr.classList.add('show');
                bodyErr.textContent = 'Body is required';
                valid = false;
            } else {
                bodyErr.classList.remove('show');
            }

            const combined = (titleInput.value.trim() + '\n\n' + bodyInput.value.trim()).length;
            if (combined > MAX_CHARS) {
                bodyErr.classList.add('show');
                bodyErr.textContent = `Combined text exceeds ${MAX_CHARS.toLocaleString()} character limit`;
                valid = false;
            }

            return valid;
        }

        // Submit form
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.classList.remove('show');
            resultsContainer.style.display = 'none';

            if (!validate()) return;

            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Processing...';

            try {
                const res = await fetch('/extract-entities', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: titleInput.value.trim(),
                        body: bodyInput.value.trim()
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    const msg = data.detail?.message || data.detail?.error || JSON.stringify(data.detail) || 'Unknown error';
                    throw new Error(msg);
                }

                renderResults(data);
            } catch (err) {
                errorBox.textContent = `Error: ${err.message}`;
                errorBox.classList.add('show');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Extract Entities';
            }
        });

        function renderResults(data) {
            const { entities, meta } = data;

            // Summary chips
            const summary = document.getElementById('results-summary');
            const labelCounts = {};
            entities.forEach(e => { labelCounts[e.label] = (labelCounts[e.label] || 0) + 1; });

            summary.innerHTML = `
                <div class="stat-chip"><strong>${meta.entity_count}</strong> entities found</div>
                <div class="stat-chip">Model: <strong>${meta.model}</strong></div>
                ${Object.entries(labelCounts).map(([l, c]) => 
                    `<div class="stat-chip"><span class="label-badge ${l}">${l}</span> <strong>${c}</strong></div>`
                ).join('')}
            `;

            // Entity table
            const wrapper = document.getElementById('entity-table-wrapper');
            if (entities.length === 0) {
                wrapper.innerHTML = `
                    <div class="no-entities">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 15h8M9 9h.01M15 9h.01"/></svg>
                        <p>No named entities were detected in this article.</p>
                    </div>
                `;
            } else {
                wrapper.innerHTML = `
                    <table class="entity-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Entity Text</th>
                                <th>Label</th>
                                <th>Start</th>
                                <th>End</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${entities.map((e, i) => `
                                <tr>
                                    <td class="offset-text">${i + 1}</td>
                                    <td class="entity-text">${escapeHtml(e.text)}</td>
                                    <td><span class="label-badge ${e.label}">${e.label}</span></td>
                                    <td class="offset-text">${e.start}</td>
                                    <td class="offset-text">${e.end}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }

            // Highlighted text
            const combinedText = titleInput.value.trim() + '\n\n' + bodyInput.value.trim();
            const hlText = document.getElementById('highlighted-text');
            hlText.innerHTML = highlightEntities(combinedText, entities);

            resultsContainer.style.display = 'block';
            resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function highlightEntities(text, entities) {
            if (!entities.length) return escapeHtml(text);

            // Sort by start position (descending to insert from end)
            const sorted = [...entities].sort((a, b) => a.start - b.start);
            let result = '';
            let lastIdx = 0;

            sorted.forEach(e => {
                if (e.start >= lastIdx) {
                    result += escapeHtml(text.slice(lastIdx, e.start));
                    result += `<span class="hl-${e.label}" title="${e.label}: ${escapeHtml(e.text)}">${escapeHtml(text.slice(e.start, e.end))}</span>`;
                    lastIdx = e.end;
                }
            });
            result += escapeHtml(text.slice(lastIdx));
            return result;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
